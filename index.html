function selectLang(l){lang=l;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('selected'));event.target.closest('.lang-btn').classList.add('selected');document.getElementById('startBtn').disabled=false;play(800)}
function startApp(){if(!lang)return;show('main');renderCourses();play(1200)}
function renderCourses(){let c=document.getElementById('content');c.innerHTML='';Object.keys(courses[lang]).forEach(k=>{let co=courses[lang][k];let sec=document.createElement('div');sec.className='course';let dn=co.lessons.filter(l=>done.has(l.id)).length;let pr=Math.round(dn/co.lessons.length*100);sec.innerHTML=`<div class="course-header"><div class="course-title">${co.icon} ${co.title}</div><div class="course-desc">${co.desc}</div><div class="course-progress"><div class="course-progress-fill" style="width:${pr}%"></div></div></div><div class="lessons"></div>`;let ls=sec.querySelector('.lessons');co.lessons.forEach((l,i)=>{let lc=i>0&&!done.has(co.lessons[i-1].id);let d=document.createElement('div');d.className='lesson'+(done.has(l.id)?' done':'')+(lc?' locked':'');d.innerHTML=`<div class="lesson-top"><div class="lesson-num">${l.id}</div><div class="lesson-title">${l.t}</div><div class="lesson-check">${done.has(l.id)?'✅':lc?'🔒':'⭕'}</div></div><div class="lesson-desc">${l.d} • ${l.xp} XP</div>`;if(!lc)d.onclick=()=>openLesson(l);ls.appendChild(d)});c.appendChild(sec)});updateStats()}
function openLesson(l){curr=l;let h=`<div style="padding:12px;padding-bottom:80px">${l.th}<div style="background:#0d1117;border-radius:8px;overflow:hidden;margin:10px 0"><div style="background:rgba(26,31,58,.8);padding:8px 10px;display:flex;justify-content:space-between"><span style="color:#00ff88;font-size:11px">Kod</span><button onclick="runCode()" style="padding:5px 10px;background:linear-gradient(135deg,#00ff88,#00d4ff);border:none;border-radius:4px;color:#0a0e27;font-size:10px;font-weight:bold">▶</button></div><textarea id="code" style="width:100%;height:150px;padding:10px;background:#0d1117;border:none;color:#fff;font-family:monospace;font-size:11px;resize:none">${l.s}</textarea></div><div style="background:#0d1117;border-radius:8px;overflow:hidden;margin:10px 0"><div style="background:rgba(26,31,58,.8);padding:8px 10px"><span style="color:#00ff88;font-size:11px">Natija</span></div><iframe id="preview" style="width:100%;height:150px;border:none;background:#fff"></iframe></div><div style="display:flex;gap:6px;margin-top:10px"><button onclick="showHint()" style="flex:1;padding:10px;background:rgba(255,255,255,.1);border:none;border-radius:6px;color:#fff;font-size:11px;font-weight:bold">💡 Yordam</button><button onclick="checkCode()" style="flex:1;padding:10px;background:linear-gradient(135deg,#00ff88,#00d4ff);border:none;border-radius:6px;color:#0a0e27;font-size:11px;font-weight:bold">✓ Tekshir</button></div></div>`;let mo=document.createElement('div');mo.style.cssText='position:fixed;inset:0;background:#0a0e27;z-index:200;overflow-y:auto';mo.innerHTML=`<div style="background:rgba(26,31,58,.9);padding:10px 12px;position:sticky;top:0;display:flex;gap:8px;align-items:center;z-index:201"><button onclick="closeLesson()" style="background:rgba(255,255,255,.1);border:none;padding:6px 10px;border-radius:4px;color:#fff;font-size:11px;font-weight:bold">← Orqaga</button><span style="font-size:12px;font-weight:bold">${l.t}</span></div>${h}`;document.body.appendChild(mo);document.getElementById('kbToggle').style.display='block';play(1000)}
function closeLesson(){document.querySelectorAll('div').forEach(d=>{if(d.style.position=='fixed'&&d.style.inset=='0px')d.remove()});document.getElementById('kbToggle').style.display='none';closeKB()}
function runCode(){let c=document.getElementById('code').value,f=document.getElementById('preview'),d=f.contentDocument;d.open();d.write(c);d.close();play(1000)}
function checkCode(){let c=document.getElementById('code').value.toLowerCase(),a=curr.a.toLowerCase();if(c.includes(a)){done.add(curr.id);totalXP+=curr.xp;document.getElementById('modalIcon').textContent='🎉';document.getElementById('modalTitle').textContent='Barakalla!';document.getElementById('modalText').textContent=`+${curr.xp} XP olindi!`;document.getElementById('modal').classList.add('show');play(1500)}else{document.getElementById('modalIcon').textContent='❌';document.getElementById('modalTitle').textContent='Xato';document.getElementById('modalText').textContent='Qayta urinib ko\'ring!';document.getElementById('modal').classList.add('show');play(400)}}
function showHint(){alert(`Yordam: ${curr.s}`)}
function closeModal(){document.getElementById('modal').classList.remove('show');if(done.has(curr.id)){closeLesson();renderCourses()}}
function switchTab(t){document.querySelectorAll('.tab').forEach(ta=>ta.classList.remove('active'));event.target.classList.add('active');play(600)}
function setMode(m){kbMode=m;document.querySelectorAll('.kb-mode-btn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');renderKB()}
function renderKB(){let c=document.getElementById('kbContent'),k=kb[kbMode];c.innerHTML='';k.forEach(r=>{let ro=document.createElement('div');ro.className='kb-row';r.forEach(ke=>{let key=document.createElement('div');key.className='kb-key';key.textContent=ke;key.onclick=()=>{insert(ke);play(700)};ro.appendChild(key)});c.appendChild(ro)});let ct=document.createElement('div');ct.className='kb-row';ct.innerHTML='<div class="kb-key" style="flex:1.5" onclick="insert(\'  \');play(700)">Tab</div><div class="kb-key" style="flex:1.5" onclick="insert(\' \');play(700)">Space</div><div class="kb-key" style="flex:1.5" onclick="insert(\'\\n\');play(700)">↵</div>';c.appendChild(ct)}
function insert(ch){let t=document.getElementById('code');if(!t)return;let st=t.selectionStart,en=t.selectionEnd,v=t.value;t.value=v.substring(0,st)+ch+v.substring(en);t.selectionStart=t.selectionEnd=st+ch.length;t.focus()}
function toggleKB(){let k=document.getElementById('kb');k.classList.contains('show')?closeKB():(k.classList.add('show'),renderKB())}
function closeKB(){document.getElementById('kb').classList.remove('show')}
function toggleSound(){sound=!sound;event.target.textContent=sound?'🔊':'🔇'}
function updateStats(){document.getElementById('xp').textContent=totalXP;document.getElementById('lvl').textContent=Math.floor(totalXP/500)+1}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function play(f){if(!sound)return;try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.setValueAtTime(.1,c.currentTime);g.gain.exponentialRampToValueAtTime(.01,c.currentTime+.1);o.start();o.stop(c.currentTime+.1)}catch(e){}}
</script>
